<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="https://epg.dunc.app/favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TV</title>

    <style>
        html, body, #video-container {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            background-color: #000;
            touch-action: none;
        }

        #video {
            width: 100%;
            height: 100%;
        }

        /* Legacy full-screen description box (Arrow Up) */
        #video-description {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            background-color: rgba(0,0,0,0.6);
            color: #fff;
            padding: 20px;
            text-align: center;
            font-size: 1.5em;
            font-family: 'Roboto', sans-serif;
            box-sizing: border-box;
            display: none;
            pointer-events: none;
            z-index: 10;
        }

        /* --- MINI OVERLAY STYLES --- */
        #mini-info-bar {
            position: fixed;
            bottom: 50px;
            left: 50px;
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            color: white;
            padding: 25px;
            border-radius: 15px;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
            opacity: 0;
            transform: translateY(20px);
            z-index: 9999;
            border-left: 6px solid #00aaff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            pointer-events: none;
            font-family: 'Segoe UI', Roboto, sans-serif;
            max-width: 700px;
        }

        #mini-info-bar.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .info-image {
            width: 160px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 25px;
            background: #222;
        }

        .info-content { display: flex; flex-direction: column; flex: 1; }
        .info-channel { font-size: 0.85rem; text-transform: uppercase; color: #00aaff; font-weight: bold; letter-spacing: 1.5px; }
        .info-title { font-size: 1.6rem; font-weight: 600; margin: 2px 0; }
        .info-time { font-size: 1rem; color: #00aaff; margin-bottom: 8px; font-weight: 500; }

        /* New Integrated Description */
        .info-mini-desc {
            font-size: 0.95rem;
            color: #ccc;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* Limit to 2 lines */
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        @media screen and (max-width: 470px) {
        #mini-info-bar {
            display: none !important;
        }

        /* Optional: Also hide the legacy description if it's too big for small screens */
        #video-description {
            font-size: 1rem;
            padding: 10px;
        }
    }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="video" autoplay controls playsinline></video>
        <div id="video-description"></div>
    </div>

    <div id="mini-info-bar">
        <img id="info-img" class="info-image" src="">
        <div class="info-content">
            <div id="info-ch-name" class="info-channel">LIVE STREAM</div>
            <div id="info-program" class="info-title">Loading...</div>
            <div id="info-duration" class="info-time">--:-- - --:--</div>
            <div id="info-desc-text" class="info-mini-desc"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        // --- Globals (Legacy Var Support) ---
        var channelSourceKey = 'channelSource';
        var channelSource = localStorage.getItem(channelSourceKey) || 'channels.json';

        var DOUBLE_CLICK_TIME_MS = 500;
        var TRIPLE_TAP_TIME_MS = 600;
        var STANDBY_URL = 'https://dj.dunc.app/control/standby';
        var ON_URL = 'https://dj.dunc.app/control/epg';
        var SWIPE_THRESHOLD = 70;

        var lastContextMenuTimestamp = 0;
        var contextMenuTimer = null;
        var touchStartX = 0;
        var touchEndX = 0;
        var tapCount = 0;
        var tapTimer = null;

        var video = document.getElementById('video');
        var videoContainer = document.getElementById('video-container');

        // --- Guide data: epg.ass (EPG2) from epg.josh.red, cached in IndexedDB ---
        // Same database, key and record shape as index.html, so the two pages share one download.
        var EPG_ASS_URL = 'https://epg.josh.red/epg.ass';
        var EPG_MAX_AGE_MS = 6 * 60 * 60 * 1000;
        // Index = the channel number in epg.ass (dj's tdj/channels.zig order).
        // If that order ever changes the file's magic changes and parseEpgAss refuses it.
        var EPG_CHANNELS = [
            'dmg-abc-vic', 'dmg-seven-mel', 'dmg-channel-9-vic', 'dmg-10-vic', 'dmg-c31', 'dmg-sbs-sbst',
            'dmg-abc-news', 'dmg-abc-kids', 'dmg-abc-me',
            'dmg-7two-mel', 'dmg-7flix-mel', null /* 7Bravo */, 'dmg-7mate-mel', null /* Racing */, null /* TVSN */,
            'dmg-life-vic', 'dmg-gem-vic', 'dmg-go-vic', null /* 9Extra */, 'dmg-rush-vic',
            'dmg-10peach-vic', 'dmg-10shake-vic', 'dmg-10bold-vic', null /* you.tv */, null /* gecko */,
            'dmg-sbs-4syd', 'dmg-sbs-2syd', 'dmg-sbs-3syd', 'dmg-sbs-5nsw', null /* SBS World */
        ];
        var infoImgUrl = null;

        // u64 read as two u32 halves, so no BigInt is needed.
        function readSeconds(dv, p) {
            return dv.getUint32(p, true) + dv.getUint32(p + 4, true) * 4294967296;
        }

        function parseEpgAss(buf) {
            var dv = new DataView(buf);
            if (buf.byteLength < 16 || dv.getUint32(0, true) !== 0x32475045) throw new Error('epg.ass: not EPG2');
            if (dv.getUint32(4, true) !== EPG_CHANNELS.length) throw new Error('epg.ass: channel count changed');
            var count = dv.getUint32(8, true);
            var pool = 16 + 20000 * 40;
            if (buf.byteLength !== pool + dv.getUint32(12, true)) throw new Error('epg.ass: size mismatch');
            var td = new TextDecoder();
            var out = [];
            for (var i = 0; i < count; i++) {
                var p = 16 + i * 40;
                var imageLen = dv.getUint32(p + 28, true);
                out.push({
                    start: readSeconds(dv, p) * 1000,
                    stop: readSeconds(dv, p + 8) * 1000,
                    title: td.decode(new Uint8Array(buf, pool + dv.getUint32(p + 16, true), dv.getUint32(p + 20, true))),
                    image: imageLen ? new Uint8Array(buf, pool + dv.getUint32(p + 24, true), imageLen) : null,
                    channel: EPG_CHANNELS[dv.getUint16(p + 32, true)]
                });
            }
            return out;
        }

        function epgStore(mode, fn) {
            return new Promise(function(resolve, reject) {
                var open = indexedDB.open('epg', 1);
                open.onupgradeneeded = function() { open.result.createObjectStore('files'); };
                open.onerror = function() { reject(open.error); };
                open.onsuccess = function() {
                    var tx = open.result.transaction('files', mode);
                    var req = fn(tx.objectStore('files'));
                    tx.oncomplete = function() { resolve(req.result); };
                    tx.onerror = function() { reject(tx.error); };
                };
            });
        }

        // Fresh cache -> use it. Stale or missing -> fetch; if the fetch fails, fall back to stale.
        function loadEpgAss() {
            var cached = null;
            return epgStore('readonly', function(s) { return s.get('epg.ass'); })
                .catch(function(e) { console.error(e); return null; })
                .then(function(c) {
                    cached = c;
                    if (cached && Date.now() - cached.fetchedAt < EPG_MAX_AGE_MS) return parseEpgAss(cached.buf);
                    return fetch(EPG_ASS_URL)
                        .then(function(res) {
                            if (!res.ok) throw new Error('epg.ass: HTTP ' + res.status);
                            return res.arrayBuffer();
                        })
                        .then(function(buf) {
                            var programmes = parseEpgAss(buf); // never cache a file we can't read
                            return epgStore('readwrite', function(s) { return s.put({ buf: buf, fetchedAt: Date.now() }, 'epg.ass'); })
                                .catch(function(e) { console.error(e); })
                                .then(function() { return programmes; });
                        })
                        .catch(function(e) {
                            if (!cached) throw e;
                            console.warn('Using stale epg.ass:', e);
                            return parseEpgAss(cached.buf);
                        });
                });
        }

        // --- Helpers ---

        // Fixed to handle squashed regional names like 5NSW
        function cleanTitle(str) {
            if (!str) return "";
            return str.toUpperCase()
                .replace(/DMG|VIC|MEL|NSW|SYD|SBST/gi, '')
                .replace(/-/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function changeChannel(direction, channelsOrder, currentIndex, channelLinkMap) {
            var idx;
            if (direction === 'prev') {
                idx = currentIndex - 1;
                if (idx < 0) idx = channelsOrder.length - 1;
            } else {
                idx = (currentIndex + 1) % channelsOrder.length;
            }
            var target = channelsOrder[idx];
            if (target && channelLinkMap[target.id]) {
                localStorage.setItem('selectedChannel', target.id);
                // Save current as previous before leaving
                if (channelsOrder[currentIndex]) {
                    localStorage.setItem('prevChannel', channelsOrder[currentIndex].id);
                }
                window.location.href = channelLinkMap[target.id];
            }
        }

        function toggleSubtitles() {
            var tracks = video.textTracks;
            for (var i = 0; i < tracks.length; i++) {
                if (tracks[i].kind === 'subtitles' || tracks[i].kind === 'captions') {
                    tracks[i].mode = (tracks[i].mode === 'showing' ? 'hidden' : 'showing');
                }
            }
        }

        function disableSubtitles() {
            var tracks = video.textTracks;
            var found = false;
            for (var i = 0; i < tracks.length; i++) {
                if (tracks[i].kind === 'subtitles' || tracks[i].kind === 'captions') {
                    tracks[i].mode = 'hidden';
                    found = true;
                }
            }
            return found;
        }

        function sendRequest(url, commandName) {
            fetch(url, { method: 'POST' })
                .then(function(response) { if (response.ok) console.log(commandName + " sent."); })
                .catch(function(error) { console.error("Error sending " + commandName, error); });
        }

        function getUrlParameter(name) {
            var regex = new RegExp('[?&]' + name + '=([^&#]*)');
            var result = regex.exec(window.location.search);
            return result ? decodeURIComponent(result[1]) : '';
        }

        function getUrlParameterCheck(name, url) {
            var base = 'https://goddardduncan.github.io/epg/';
            return url.indexOf(base) !== -1 ? url.slice(url.indexOf(base) + base.length) : url;
        }

        function formatTime(date) {
            return date.toLocaleTimeString("en-AU", { hour: 'numeric', minute: '2-digit', hour12: false });
        }

        function fetchEPGData(selectedChannel) {
            loadEpgAss()
                .then(function(programmes) {
                    var now = Date.now();
                    var list = programmes
                        .filter(function(p) { return p.channel === selectedChannel; })
                        .sort(function(a, b) { return a.start - b.start; });

                    for (var i = 0; i < list.length; i++) {
                        var p = list[i];
                        if (now < p.start || now >= p.stop) continue;

                        // epg.ass carries no synopsis, so the description slot says what is on next.
                        var next = list[i + 1];
                        var desc = next ? "Next: " + next.title + " at " + formatTime(new Date(next.start)) : "";

                        if (infoImgUrl) URL.revokeObjectURL(infoImgUrl);
                        infoImgUrl = p.image ? URL.createObjectURL(new Blob([p.image], { type: 'image/jpeg' })) : null;

                        document.getElementById('info-ch-name').innerText = cleanTitle(selectedChannel);
                        document.getElementById('info-program').innerText = p.title;
                        document.getElementById('info-img').src = infoImgUrl || "";
                        document.getElementById('info-duration').innerText = formatTime(new Date(p.start)) + " - " + formatTime(new Date(p.stop));

                        // Update the mini-bar description and the legacy full-screen description
                        document.getElementById('info-desc-text').innerText = desc;
                        document.getElementById("video-description").innerText = p.title + (desc ? " — " + desc : "");

                        var bar = document.getElementById('mini-info-bar');
                        bar.classList.add('visible');
                        setTimeout(function() { bar.classList.remove('visible'); }, 5000);
                        break;
                    }
                }).catch(function(e) { console.error("EPG error", e); });
        }

        // --- Main Initialization ---
        document.addEventListener("DOMContentLoaded", function() {
            var channelsOrder = [];
            var channelLinkMap = {};

            fetch('channelorder.json')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    channelsOrder = data;
                    return fetch(channelSource).then(function(r) { return r.json(); });
                })
                .then(function(data) {
                    channelLinkMap = data;
                    runPlayer(channelsOrder, channelLinkMap);
                })
                .catch(function(err) { console.error("Load error", err); });
        });

        function runPlayer(channelsOrder, channelLinkMap) {
            var urlParameter = getUrlParameter('url');
            var streamKey = getUrlParameter('stream');
            var urlCheck = getUrlParameterCheck('url', window.location.href);

            // Stream Loading Logic
            if (urlParameter) {
                if (Hls.isSupported()) {
                    var hls = new Hls();
                    hls.loadSource(urlParameter);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = urlParameter;
                    video.play();
                }
            } else if (streamKey) {
                var stored = JSON.parse(localStorage.getItem('m3u8Files') || '{}');
                if (stored[streamKey]) {
                    var blob = new Blob([stored[streamKey]], { type: 'application/vnd.apple.mpegurl' });
                    var blobUrl = URL.createObjectURL(blob);
                    if (Hls.isSupported()) {
                        var hls = new Hls();
                        hls.loadSource(blobUrl);
                        hls.attachMedia(video);
                    } else { video.src = blobUrl; video.play(); }
                }
            }

            // Subtitle cleanup logic
            var subtitleInterval = setInterval(function() {
                if (disableSubtitles()) {
                    setTimeout(disableSubtitles, 2000);
                    clearInterval(subtitleInterval);
                }
            }, 500);

            // Channel identification logic
            var selectedChannel = localStorage.getItem('selectedChannel');
            for (var id in channelLinkMap) {
                if (channelLinkMap[id] === urlCheck) {
                    selectedChannel = id;
                    localStorage.setItem('selectedChannel', id);
                    break;
                }
            }

            // Find current and previous indices for navigation
            var currentIndex = -1;
            for (var i = 0; i < channelsOrder.length; i++) {
                if (channelsOrder[i].id === selectedChannel) { currentIndex = i; break; }
            }

            var prevId = localStorage.getItem('prevChannel');
            var prevIndex = -1;
            for (var j = 0; j < channelsOrder.length; j++) {
                if (channelsOrder[j].id === prevId) { prevIndex = j; break; }
            }

            if (currentIndex !== -1) {
                document.title = channelsOrder[currentIndex].name;
            }

            if (selectedChannel) fetchEPGData(selectedChannel);

            // --- Control Event Listeners ---

            // Right Click / Context Menu logic (Subtitles / On / Standby)
            document.addEventListener("contextmenu", function(e) {
                e.preventDefault();
                var now = Date.now();
                if (now - lastContextMenuTimestamp < DOUBLE_CLICK_TIME_MS) {
                    clearTimeout(contextMenuTimer);
                    sendRequest(STANDBY_URL, 'Standby');
                } else {
                    toggleSubtitles();
                    contextMenuTimer = setTimeout(function() { sendRequest(ON_URL, 'On'); }, DOUBLE_CLICK_TIME_MS);
                }
                lastContextMenuTimestamp = now;
            });

            // Touch Gestures (Swipe to change / Triple Tap to home)
            videoContainer.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
            }, {passive: true});

            videoContainer.addEventListener('touchend', function(e) {
                touchEndX = e.changedTouches[0].screenX;
                var dist = touchEndX - touchStartX;
                if (Math.abs(dist) > SWIPE_THRESHOLD) {
                    tapCount = 0; clearTimeout(tapTimer);
                    changeChannel(dist > 0 ? 'prev' : 'next', channelsOrder, currentIndex, channelLinkMap);
                } else {
                    tapCount++;
                    clearTimeout(tapTimer);
                    tapTimer = setTimeout(function() {
                        if (tapCount === 3) window.location.href = 'index.html';
                        tapCount = 0;
                    }, TRIPLE_TAP_TIME_MS);
                }
            }, {passive: true});

            // Keyboard Controls
            window.addEventListener("keydown", function(ev) {
                if (ev.key === "Enter") {
                    video.play();
                } else if (ev.key === "Escape" || (ev.key === "ArrowLeft" && ev.metaKey)) {
                    ev.preventDefault();
                    if (prevIndex !== -1) {
                        window.location.href = channelLinkMap[channelsOrder[prevIndex].id];
                    }
                } else if (ev.key === "ArrowLeft") {
                    changeChannel('prev', channelsOrder, currentIndex, channelLinkMap);
                } else if (ev.key === "ArrowRight") {
                    changeChannel('next', channelsOrder, currentIndex, channelLinkMap);
                } else if (ev.key === "ArrowUp") {
                    var desc = document.getElementById('video-description');
                    desc.style.display = desc.style.display === 'block' ? 'none' : 'block';
                } else if (ev.key === "ArrowDown") {
                    video.muted = !video.muted;
                    var tracks = video.textTracks;
                    for (var k = 0; k < tracks.length; k++) {
                        if (tracks[k].kind === 'subtitles' || tracks[k].kind === 'captions') {
                            tracks[k].mode = video.muted ? 'showing' : 'hidden';
                        }
                    }
                } else if (ev.key.toLowerCase() === 'i') {
                    fetchEPGData(selectedChannel);
                }
            });
        }
    </script>
</body>
</html>
